<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="miku-title miku-desc">
  <title id="miku-title">HATSUNE MIKU / CV01</title>
  <desc id="miku-desc">初音未来意象图标：葱绿双马尾、一根葱、数字 39</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2b31"/>
      <stop offset="1" stop-color="#020a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".74">
      <stop offset="0" stop-color="#39c5bb" stop-opacity=".4"/>
      <stop offset="1" stop-color="#39c5bb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stalk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eafffd"/>
      <stop offset="1" stop-color="#b9f7ee"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="12.8" fill="none" stroke="#39c5bb" stroke-width="2.2" stroke-opacity=".8"/>

  <!-- 双马尾：两侧各一条长发从发圈垂到腰际（粉描边 + 葱绿内线），中间用发顶弧线连出发型 -->
  <g fill="none" stroke-linecap="round">
    <path d="M20.5 11C24 7.4 40 7.4 43.5 11" stroke="#39c5bb" stroke-width="2" stroke-opacity=".5"/>
    <path d="M21 10C13 16 10 26 12 36c1 9-1 15-3 21" stroke="#ff2f8e" stroke-width="5.2"/>
    <path d="M21 12c-6 6-8 14-6.5 24 1 8-1 14-3 20" stroke="#39c5bb" stroke-width="2.4"/>
    <path d="M43 10c8 6 11 16 9 26-1 9 1 15 3 21" stroke="#ff2f8e" stroke-width="5.2"/>
    <path d="M43 12c6 6 8 14 6.5 24-1 8 1 14 3 20" stroke="#39c5bb" stroke-width="2.4"/>
  </g>
  <!-- 发圈 -->
  <circle cx="21" cy="10.5" r="3.6" fill="#ff2f8e"/>
  <circle cx="43" cy="10.5" r="3.6" fill="#ff2f8e"/>
  <circle cx="21" cy="10.5" r="1.5" fill="#ff86cd"/>
  <circle cx="43" cy="10.5" r="1.5" fill="#ff86cd"/>

  <!-- 葱：白茎 + 绿叶，立在中间 -->
  <g>
    <path d="M29.5 40.5V28.6c0-1.7 5-1.7 5 0V40.5c0 1.3-5 1.3-5 0Z" fill="url(#stalk)"/>
    <path d="M29.5 32.6V28.6c0-1.7 5-1.7 5 0v4Z" fill="#39c5bb"/>
    <g stroke="#eafffd" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round" fill="none">
      <path d="M30.8 41.4l-.9 2.8"/>
      <path d="M32 41.7v2.9"/>
      <path d="M33.2 41.4l.9 2.8"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M31 28.4c-1.8-4.6-3.4-9.4-5-13.8" stroke="#39c5bb" stroke-width="2.6" stroke-opacity=".85"/>
      <path d="M33 28.4c1.8-4.6 3.4-9.4 5-13.8" stroke="#39c5bb" stroke-width="2.6" stroke-opacity=".85"/>
      <path d="M32 28.6c-.5-6-.3-12.6 0-18.2" stroke="#39c5bb" stroke-width="3.4"/>
      <path d="M32 28c-.4-5.6-.3-12 0-17.2" stroke="#a8fff4" stroke-width="1.2" stroke-opacity=".9"/>
    </g>
  </g>

  <!-- 39 -->
  <g fill="none" stroke="#39c5bb" stroke-opacity=".26" stroke-width="5" stroke-linecap="round">
    <path d="M24.3 47.5a3 3 0 0 1 0 6 3 3 0 0 1 0 6"/>
    <path d="M39.9 50.5c0 4.7-1.5 7.3-4.7 9.2"/>
    <circle cx="36.9" cy="50.5" r="3"/>
  </g>
  <g fill="none" stroke="#39c5bb" stroke-width="2.4" stroke-linecap="round">
    <path d="M24.3 47.5a3 3 0 0 1 0 6 3 3 0 0 1 0 6"/>
    <path d="M39.9 50.5c0 4.7-1.5 7.3-4.7 9.2"/>
    <circle cx="36.9" cy="50.5" r="3" stroke="#a8fff4" stroke-width="1.2" stroke-opacity=".9"/>
  </g>
</svg>
